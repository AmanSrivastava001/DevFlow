spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
app:
  jwt-secret: ${JWT_SECRET}
